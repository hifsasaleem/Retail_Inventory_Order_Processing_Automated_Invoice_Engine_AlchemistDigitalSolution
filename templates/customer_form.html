{% extends "base.html" %}{% block title %}Customer{% endblock %}{% block content %}
<h2>{{ 'Edit' if customer else 'Add' }} Customer</h2><div class="panel form-panel"><form method="post">
<label class="form-label">Full name</label><input class="form-control mb-3" name="name" required value="{{ customer.name if customer else '' }}">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" value="{{ customer.email if customer else '' }}">
<label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ customer.phone if customer else '' }}">
<label class="form-label">Address</label><textarea class="form-control mb-3" name="address">{{ customer.address if customer else '' }}</textarea>
<button class="btn btn-primary">Save Customer</button> <a class="btn btn-light" href="{{ url_for('customer_list') }}">Cancel</a></form></div>{% endblock %}
